# nginx als Reverse Proxy vor node server.mjs (127.0.0.1:3000)
#
# Diese Datei ist absichtlich nur für HTTP gedacht: Solange noch kein Zertifikat
# existiert, würde ein `listen 443 ssl`-Block `nginx -t` mit
#   no "ssl_certificate" is defined for the "listen ... ssl" directive
# abbrechen. Genau deshalb kommt TLS erst danach ins Spiel:
#
#   sudo certbot --nginx -d atai-judo-academy.com -d www.atai-judo-academy.com
#
# Certbot erweitert diesen Serverblock um 443, trägt die Zertifikatspfade ein
# und legt die Weiterleitung von HTTP auf HTTPS an. Die location-Blöcke bleiben
# dabei erhalten.

server {
    listen 80;
    listen [::]:80;
    server_name atai-judo-academy.com www.atai-judo-academy.com;

    # Verifikation für Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Uploads im Admin (Bilder bis 8 MB) und Formular-Anfragen
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Statische Dateien direkt ausliefern (schneller als über Node)
    location /assets/ {
        alias /srv/atai-judo/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, must-revalidate";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # wichtig: die Anwendung entscheidet daran über sichere Cookies
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ein Neubau nach dem Speichern dauert meist < 1 s, Uploads etwas länger
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
