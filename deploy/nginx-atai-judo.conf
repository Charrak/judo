# nginx als Reverse Proxy vor node server.mjs (127.0.0.1:3000)
# Zertifikate trägt `certbot --nginx` ein.

server {
    listen 80;
    listen [::]:80;
    server_name atai-judo-academy.com www.atai-judo-academy.com;

    # Verifikation für Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.atai-judo-academy.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.atai-judo-academy.com;

    # certbot --nginx ergänzt ssl_certificate, ssl_certificate_key und die Optionen.

    # Uploads im Admin (Bilder bis 8 MB) und Formular-Anfragen
    client_max_body_size 12m;

    # Sicherheits-Kopfzeilen; die Seite selbst liefert ihre eigenen mit.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # wichtig: die Anwendung entscheidet daran über sichere Cookies
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ein Neubau nach dem Speichern dauert meist < 1 s, Uploads etwas länger
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Statische Dateien direkt ausliefern (schneller als über Node)
    location /assets/ {
        alias /srv/atai-judo/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, must-revalidate";
        access_log off;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name atai-judo-academy.com;

    return 301 https://www.atai-judo-academy.com$request_uri;
}
